
name: ScriptForge CI/CD

on:
  push:
    branches:
      - main
      - scriptforge-security-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend - build & type check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend - lint & type check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff mypy

      - name: Lint with Ruff
        run: python -m ruff check app/

      - name: Type check with mypy
        run: python -m mypy app/ --ignore-missing-imports

      - name: Check Python compilation
        run: python -m compileall -q app/

  docker-check:
    name: Docker - validate build
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t scriptforge-api:ci ./backend

      - name: Verify image
        run: docker image inspect scriptforge-api:ci
