
name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  PROJECT_ID: scriptforge-bluefoxes
  REGION: us-east1
  SERVICE_NAME: scriptforge-api
  REGISTRY: us-east1-docker.pkg.dev

jobs:

  # ============================================
  # JOB 1 — Frontend Build & Type Check
  # ============================================

  frontend:
    name: Frontend - build & type check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

  # ============================================
  # JOB 2 — Backend Lint & Type Check
  # ============================================

  backend:
    name: Backend - lint & type check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint with Ruff
        run: python -m ruff check app/

      - name: Type check with mypy
        run: python -m mypy app/ --ignore-missing-imports

      - name: Check Python compilation
        run: python -m compileall -q app/

  # ============================================
  # JOB 3 — Validate Docker Build
  # Runs on pull requests and main
  # ============================================

  docker-check:
    name: Docker - validate build
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build \
            --tag scriptforge-api:ci \
            ./backend

  # ============================================
  # JOB 4 — Docker Build & Push
  # Runs only on pushes to main
  # ============================================

  docker:
    name: Docker - build & push
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend
      - docker-check

    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker \
            "${{ env.REGISTRY }}" \
            --quiet

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/scriptforge/${{ env.SERVICE_NAME }}:${{ github.sha }}" \
            --tag "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/scriptforge/${{ env.SERVICE_NAME }}:latest" \
            ./backend

      - name: Push versioned Docker image
        run: |
          docker push \
            "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/scriptforge/${{ env.SERVICE_NAME }}:${{ github.sha }}"

      - name: Push latest Docker image
        run: |
          docker push \
            "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/scriptforge/${{ env.SERVICE_NAME }}:latest"

  # ============================================
  # JOB 5 — Deploy to Google Cloud Run
  # Runs only after successful Docker publishing
  # ============================================

  deploy:
    name: Deploy - Google Cloud Run
    runs-on: ubuntu-latest

    needs:
      - docker

    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # Validate required production settings
      # ----------------------------------------

      - name: Validate production configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          SESSION_SECRET_KEY: ${{ secrets.SESSION_SECRET_KEY }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}

        shell: bash
        run: |
          set -euo pipefail

          required=(
            OPENAI_API_KEY
            ANTHROPIC_API_KEY
            DATABASE_URL
            N8N_WEBHOOK_URL
            N8N_WEBHOOK_TOKEN
            ADMIN_USERNAME
            ADMIN_PASSWORD_HASH
            SESSION_SECRET_KEY
            FRONTEND_URL
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing production configuration: $name"
              exit 1
            fi
          done

          if [[ "$N8N_WEBHOOK_URL" != \
            "https://josue07.app.n8n.cloud/webhook/scriptforge-content" ]]; then
            echo "::error::Incorrect n8n production webhook URL"
            exit 1
          fi

          if [[ "$FRONTEND_URL" != \
            "https://scriptforge-eosin.vercel.app" ]]; then
            echo "::error::Unexpected frontend production URL"
            exit 1
          fi

          echo "Production configuration validated."

      # ----------------------------------------
      # Authenticate to Google Cloud
      # ----------------------------------------

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # ----------------------------------------
      # Deploy FastAPI to Cloud Run
      # ----------------------------------------

      - name: Deploy to Google Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2

        with:
          project_id: ${{ env.PROJECT_ID }}
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}

          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/scriptforge/${{ env.SERVICE_NAME }}:${{ github.sha }}

          env_vars_update_strategy: merge

          env_vars: |
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            N8N_WEBHOOK_URL=${{ secrets.N8N_WEBHOOK_URL }}
            N8N_WEBHOOK_TOKEN=${{ secrets.N8N_WEBHOOK_TOKEN }}
            ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
            ADMIN_PASSWORD_HASH=${{ secrets.ADMIN_PASSWORD_HASH }}
            SESSION_SECRET_KEY=${{ secrets.SESSION_SECRET_KEY }}
            FRONTEND_URL=${{ vars.FRONTEND_URL }}
            AUTH_COOKIE_SECURE=true

      # ----------------------------------------
      # Display deployed service URL
      # ----------------------------------------

      - name: Show deployed URL
        run: |
          echo "Deployed to ${{ steps.deploy.outputs.url }}"
